services:
  minio:
    image: minio/minio
    container_name: contract_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    container_name: contract_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - minio

  frontend:
    build: .
    container_name: contract_frontend
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app
    command: python -m streamlit run frontend/app.py --server.address 0.0.0.0
    depends_on:
      - api

volumes:
  minio_data: